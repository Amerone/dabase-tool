[package]
name = "dm8-export-backend"
version = "0.1.0"
edition = "2021"
default-run = "dm8-export-backend"
autobins = false

[features]
default = []
diagnostic-bins = []

[[bin]]
name = "dm8-export-backend"
path = "src/main.rs"
test = false

[[bin]]
name = "test_two_envs"
path = "src/bin/test_two_envs.rs"
required-features = ["diagnostic-bins"]

[[bin]]
name = "test_odpi_ffi"
path = "src/bin/test_odpi_ffi.rs"
required-features = ["diagnostic-bins"]

[[bin]]
name = "test_aci_stack"
path = "src/bin/test_aci_stack.rs"
required-features = ["diagnostic-bins"]

[[bin]]
name = "test_aci_rodata"
path = "src/bin/test_aci_rodata.rs"
required-features = ["diagnostic-bins"]

[[bin]]
name = "test_aci_reuse"
path = "src/bin/test_aci_reuse.rs"
required-features = ["diagnostic-bins"]

[[bin]]
name = "test_aci_ptr"
path = "src/bin/test_aci_ptr.rs"
required-features = ["diagnostic-bins"]

[[bin]]
name = "test_aci_noloop"
path = "src/bin/test_aci_noloop.rs"
required-features = ["diagnostic-bins"]

[[bin]]
name = "test_aci_minimal"
path = "src/bin/test_aci_minimal.rs"
required-features = ["diagnostic-bins"]

[[bin]]
name = "test_aci_loop"
path = "src/bin/test_aci_loop.rs"
required-features = ["diagnostic-bins"]

[[bin]]
name = "test_aci_frames"
path = "src/bin/test_aci_frames.rs"
required-features = ["diagnostic-bins"]

[[bin]]
name = "test_aci_ffi"
path = "src/bin/test_aci_ffi.rs"
required-features = ["diagnostic-bins"]

[[bin]]
name = "test_aci_direct"
path = "src/bin/test_aci_direct.rs"
required-features = ["diagnostic-bins"]

[[bin]]
name = "test_aci_clone"
path = "src/bin/test_aci_clone.rs"
required-features = ["diagnostic-bins"]

[[bin]]
name = "test_aci"
path = "src/bin/test_aci.rs"
required-features = ["diagnostic-bins"]

[[bin]]
name = "shentong_query_test"
path = "src/bin/shentong_query_test.rs"
required-features = ["diagnostic-bins"]

[dependencies]
# Web framework
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
odbc-api = "8.0"
sqlx = { version = "0.8", default-features = false, features = ["mysql", "runtime-tokio-rustls"] }
tokio-postgres = { version = "0.7", features = [] }
futures-util = "0.3"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Environment
dotenv = "0.15"

# Local storage
rusqlite = { version = "0.30", features = ["bundled"] }
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }

# Encryption
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"

encoding_rs = "0.8"

# Connection pooling
parking_lot = "0.12"

# ShenTong native connector (ODPI-C / ACI protocol)
shentong = { path = "../drivers/shentong/rust-shentong" }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
tempfile = "3.8"
